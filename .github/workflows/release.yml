name: Draft & Publish Release

on:
  push:
    # Edited By: NeroMorte - Publish a fresh installer when main receives release metadata.
    branches: ['main']
    paths: ['TAC/lua/TAC_support_modules/morte_version.lua']
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g., v1.6)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # On manual runs package the requested tag, not whatever branch was selected.
          ref: ${{ inputs.tag_name || github.ref }}

      # Created By: NeroMorte - Use the stable fork version, not the branch name, for main releases.
      - name: Resolve Release Identity
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.tag_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          requested = os.environ.get('REQUESTED_TAG', '').strip()
          if requested:
              tag = requested
          elif os.environ.get('REF_TYPE') == 'tag':
              tag = os.environ['REF_NAME']
          else:
              metadata = open('TAC/lua/TAC_support_modules/morte_version.lua', encoding='utf-8').read()
              morte = re.search(r'version\.morte\s*=\s*\{(.*?)\}', metadata, re.S).group(1)
              fields = dict(re.findall(r"(\w+)\s*=\s*'([^']*)'", morte))
              if fields.get('channel') != 'stable':
                  raise SystemExit('Main installer publication requires stable release metadata.')
              tag = 'v' + fields['basedOnGennro'] + '-' + fields['version']
          if not re.fullmatch(r'[vV][0-9][A-Za-z0-9._-]*', tag):
              raise SystemExit('Invalid release tag.')
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          remote = subprocess.check_output(['git', 'ls-remote', 'origin', 'refs/tags/' + tag, 'refs/tags/' + tag + '^{}'], text=True)
          refs = dict(line.split()[::-1] for line in remote.splitlines())
          existing = refs.get('refs/tags/' + tag + '^{}') or refs.get('refs/tags/' + tag)
          if existing and existing != commit:
              raise SystemExit('Release tag already points elsewhere; bump the version instead of moving it.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('tag=' + tag + '\ncommit=' + commit + '\n')
          PY

      - name: Generate Release Notes
        env:
          TAG_NAME: ${{ steps.release.outputs.tag }}
        run: |
          python3 - << 'EOF'
          import os, re, sys

          tag = os.environ.get('TAG_NAME', '')
          version = re.sub(r'^[vV]', '', tag).strip()

          # RELEASES.md holds a short, hand-written summary per release
          # (## <version> headings). CHANGELOG.md keeps the detailed history
          # and is linked from the release body instead of pasted into it.
          with open('RELEASES.md', 'r', encoding='utf-8') as f:
              content = f.read()

          entries = re.split(r'(?m)^## ', content)[1:]   # drop the file preamble
          if not entries:
              sys.exit('RELEASES.md has no "## <version>" entries')

          notes = None
          for entry in entries:
              heading, _, body = entry.partition('\n')
              if heading.strip() == version:
                  notes = body
                  break
          if notes is None:
              heading, _, notes = entries[0].partition('\n')
              print(f'::warning::No "## {version}" entry in RELEASES.md, using the top entry ({heading.strip()})')

          # Drop the trailing entry separator if the author left one in.
          notes = re.sub(r'\n---\s*$', '', notes.strip()) + '\n'

          footer = """
          ---

          **Full change log:** [CHANGELOG.md](https://github.com/{repo}/blob/{tag}/CHANGELOG.md)

          ## 📦 Installation & Updating

          ### 🆕 New installation
          1. Install a **RoF2-compatible 32-bit MacroQuest** build for your EverQuest client.
          2. Download `TriuneAutocombat-Install.zip` from Assets and extract it **into the root of your MacroQuest folder**. Its `lua/`, `config/`, `resources/`, and `plugins/` paths merge into those folders.
          3. For MQ2Nav navigation, download the [complete mesh pack](https://mqmesh.com/resources/zips/MQ2Nav_meshes.zip) separately and extract its `.navmesh` files into `resources/MQ2Nav/` under the same MacroQuest folder. Those meshes are supplied by a separate site and are not bundled in this release.
          4. In game, type `/plugin mq2webupdate load` and `/lua run triune` if Triune did not open already. The **Updates** window checks the Main Download repository and handles later updates.

          ### 🔄 Updating an existing installation
          Open Triune's **Updates** window. Use **Check for Updates**, then **Stage Updates**, and confirm the appropriate **Apply Staged Files** or **Update MQ2WebUpdate** action. The updater verifies downloads and handles the DLL unload, replacement, and reload through its independent Lua coordinator. Linked files are protected from replacement.

          *Your own settings and saved loadouts (`config/triune_loadout_<server>_<char>.lua`, `config/triune_chat_<Name>.lua`) are never overwritten.*
          """.format(repo=os.environ.get('GITHUB_REPOSITORY', 'XxNeroMortexX/TriuneAutocombat'), tag=tag or 'main')
          footer = '\n'.join(line[10:] if line.startswith(' ' * 10) else line for line in footer.split('\n'))

          with open('RELEASE_NOTES.md', 'w', encoding='utf-8') as out:
              out.write(notes + footer.rstrip() + '\n')

          print('Generated RELEASE_NOTES.md for', tag or '(no tag)')
          print(open('RELEASE_NOTES.md', encoding='utf-8').read())
          EOF

      - name: Package First-Install Archive
        run: |
          # TAC/ contents map directly onto MacroQuest's root; navmeshes
          # remain in the repository but are downloaded from mqmesh.com.
          git archive --format=zip --add-file=README.md --add-file=CHANGELOG.md \
            -o TriuneAutocombat-Install.zip HEAD:TAC . ':!resources/MQ2Nav'
          python3 tools/package_release.py

      - name: Verify Archive Contents
        run: |
          python3 tools/package_release.py --verify
      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TriuneAutocombat-Install.zip
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ steps.release.outputs.commit }}
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
