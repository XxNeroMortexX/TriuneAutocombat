name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lua-syntax:
    name: LuaJIT syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua and LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit lua5.1

      - name: Bytecode-compile all Lua files (LuaJIT and Lua 5.1 luac)
        run: |
          fail=0
          while IFS= read -r f; do
            if ! luajit -bl "$f" > /dev/null 2>err.log; then
              echo "::error file=$f::LuaJIT syntax error"
              cat err.log
              fail=1
            elif ! luac -p "$f" > /dev/null 2>err.log; then
              echo "::error file=$f::luac syntax error (exceeds 200 locals or syntax failure)"
              cat err.log
              fail=1
            else
              echo "OK: $f"
            fi
          done < <(find TAC -name '*.lua' -type f)
          exit $fail

  version-sync:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract versions
        id: ver
        run: |
          MAIN=$(grep -oP "^local VERSION\s+= '\K[^']+" TAC/lua/triune.lua)
          README=$(grep -oP "Current version: \*\*\K[^*]+" README.md)
          echo "main=$MAIN"    >> "$GITHUB_OUTPUT"
          echo "readme=$README"   >> "$GITHUB_OUTPUT"
          echo "triune.lua=$MAIN | README.md=$README"

      - name: Fail on version drift
        run: |
          if [ "${{ steps.ver.outputs.main }}" != "${{ steps.ver.outputs.readme }}" ]; then
            echo "::error::Version mismatch — triune.lua (${{ steps.ver.outputs.main }}) and README.md (${{ steps.ver.outputs.readme }}) must carry the same version."
            exit 1
          fi
          echo "All versions in sync: ${{ steps.ver.outputs.main }}"

  luacheck:
    name: Luacheck static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Luacheck
        run: |
          sudo apt-get update && sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck

      - name: Run Luacheck
        run: luacheck TAC/

  unit-tests:
    name: Pure-logic unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua and LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit lua5.1

      - name: Run unit tests
        # Edited By: NeroMorte - Run the fork feature regressions as well as the core suite.
        run: |
          for test in tests/test_*.lua; do
            echo "Running $test"
            luajit "$test"
          done

      # Edited By: NeroMorte - Parse the Windows installer without touching a user checkout.
      - name: Verify test installers PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          # Edited By: NeroMorte - Validate every focused test installer.
          foreach ($installer in @((Get-ChildItem 'tools/*.ps1') + (Get-ChildItem 'MQ2Nav/*.ps1'))) {
            [System.Management.Automation.Language.Parser]::ParseFile(
              $installer.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { $parseErrors | ForEach-Object { Write-Error $_ }; exit 1 }
            Write-Host "$($installer.Name) syntax passed."
          }

  # Edited By: NeroMorte - Exercise the shipped native methods/settings without EQ or Windows.
  nav-regressions:
    name: Nav XYZ logic regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute actual source methods against MQ test doubles
        run: |
          python3 MQ2Nav/test_movement.py
          python3 MQ2Nav/test_settings.py
          python3 tests/test_nav_release.py

  theme-consistency:
    name: Theme consistency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check satellite theme drift
        run: bash tests/check_theme_consistency.sh

  # Edited By: NeroMorte - verify quiet transport and the new root boundary.
  eqbc-server-regressions:
    name: EQBC server and updater root regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
      - name: Test the Go server
        working-directory: EQBCServers/Go
        run: go test ./...
      - name: Test actual MQ-root profiles and persisted plans
        run: |
          g++ -std=c++17 -Wall -Wextra tests/eqbc_root_fixture.cpp -o /tmp/eqbc-root-test
          /tmp/eqbc-root-test
          python3 tests/test_eqbc_server_release.py
